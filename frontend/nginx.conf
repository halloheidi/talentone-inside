server {
  listen       80;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;

  # SPA-Fallback
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Lange Cache-Zeiten für Hashed-Assets
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # index.html nicht cachen
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
