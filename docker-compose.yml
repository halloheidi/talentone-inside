# TalentOne Inside — Docker-Compose für VPS 69.62.116.44
#
# Hängt am bestehenden Traefik im Netzwerk "root_default".
# Traefik leitet :80 zentral auf :443 — daher kein separater HTTP-Router nötig.
# Certresolver ist "mytlschallenge" (HTTP-01 via Let's Encrypt).

services:
  inside-backend:
    build: ./backend
    image: talentone-inside-backend:latest
    container_name: talentone-inside-backend
    restart: unless-stopped
    env_file: ./backend/.env.local
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.inside-api.rule=Host(`inside.talent-one.de`) && PathPrefix(`/api`)"
      - "traefik.http.routers.inside-api.entrypoints=web,websecure"
      - "traefik.http.routers.inside-api.tls=true"
      - "traefik.http.routers.inside-api.tls.certresolver=mytlschallenge"
      - "traefik.http.services.inside-api.loadbalancer.server.port=3001"

  inside-frontend:
    build:
      context: ./frontend
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
        VITE_API_BASE: https://inside.talent-one.de/api
    image: talentone-inside-frontend:latest
    container_name: talentone-inside-frontend
    restart: unless-stopped
    networks:
      - root_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=root_default"
      - "traefik.http.routers.inside-web.rule=Host(`inside.talent-one.de`)"
      - "traefik.http.routers.inside-web.entrypoints=web,websecure"
      - "traefik.http.routers.inside-web.tls=true"
      - "traefik.http.routers.inside-web.tls.certresolver=mytlschallenge"
      - "traefik.http.routers.inside-web.priority=1"
      - "traefik.http.services.inside-web.loadbalancer.server.port=80"

networks:
  root_default:
    external: true
